name: Application images
on:
  push:
    branches: [k3s]
    tags: ['images-*']
    paths: ['common/**', 'jobs/**', 'crawlers/**', 'docker/**', 'pyproject.toml', 'infra/scripts/processing_control.py', '.github/workflows/application-images.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified images to GHCR
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: {component: [spark-k3s, crawler]}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: name
        shell: bash
        run: |
          echo "value=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.component }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: (github.event_name == 'workflow_dispatch' && inputs.publish) || startsWith(github.ref, 'refs/tags/images-')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: docker/${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          push: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || startsWith(github.ref, 'refs/tags/images-') }}
          tags: ${{ steps.name.outputs.value }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Published digest
        if: (github.event_name == 'workflow_dispatch' && inputs.publish) || startsWith(github.ref, 'refs/tags/images-')
        env:
          IMAGE: ${{ steps.name.outputs.value }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

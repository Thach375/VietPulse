name: CI

on:
  pull_request:
  push:
    branches: [main, k3s]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e ".[crawler,streaming,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

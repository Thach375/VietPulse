[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vietpulse"
version = "0.1.0"
description = "Pipeline Lambda phân tích cảm xúc dư luận Việt Nam (HUST IT4043E)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
crawler = ["requests>=2.31", "beautifulsoup4>=4.12", "confluent-kafka>=2.3"]
streaming = ["pyspark==3.5.3"]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4.21"]

[tool.setuptools.packages.find]
include = ["common*", "crawlers*", "jobs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

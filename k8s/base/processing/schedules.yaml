# Initially suspended: first verify images, SparkPi and a real crawler receipt.
apiVersion: v1
kind: List
items:
  - apiVersion: batch/v1
    kind: CronJob
    metadata: {name: vietpulse-batch}
    spec: &schedule
      schedule: "0 1 * * *"
      timeZone: Asia/Ho_Chi_Minh
      suspend: true
      concurrencyPolicy: Forbid
      startingDeadlineSeconds: 3600
      successfulJobsHistoryLimit: 1
      failedJobsHistoryLimit: 2
      jobTemplate:
        spec:
          backoffLimit: 0
          activeDeadlineSeconds: 21600
          template:
            spec:
              restartPolicy: Never
              serviceAccountName: batch-orchestrator
              nodeSelector: {vietpulse.io/control: "true"}
              containers:
                - name: orchestrator
                  image: REQUIRED_SPARK_IMAGE
                  command: [python3, /opt/vietpulse/infra/scripts/processing_control.py]
                  args: [batch]
                  env:
                    - name: POD_UID
                      valueFrom: {fieldRef: {fieldPath: metadata.uid}}
                    - name: POD_NAMESPACE
                      valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
                  resources:
                    requests: {cpu: 50m, memory: 64Mi}
                    limits: {cpu: 250m, memory: 192Mi}
  - apiVersion: batch/v1
    kind: CronJob
    metadata: {name: reference-refresh-prepare}
    spec:
      <<: *schedule
      schedule: "0 2 * * 0"
      jobTemplate:
        spec:
          backoffLimit: 0
          activeDeadlineSeconds: 7200
          template:
            spec:
              restartPolicy: Never
              serviceAccountName: batch-orchestrator
              nodeSelector: {vietpulse.io/control: "true"}
              containers:
                - name: orchestrator
                  image: REQUIRED_SPARK_IMAGE
                  command: [python3, /opt/vietpulse/infra/scripts/processing_control.py]
                  args: [reference-prepare]
                  resources:
                    requests: {cpu: 50m, memory: 64Mi}
                    limits: {cpu: 250m, memory: 192Mi}

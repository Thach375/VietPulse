# All source templates are suspended. render-processing.py resolves required
# image digests and activates only the two streaming applications.
# https://github.com/kubeflow/spark-operator/tree/v2.5.2
apiVersion: v1
kind: List
items:
  - apiVersion: sparkoperator.k8s.io/v1beta2
    kind: SparkApplication
    metadata: {name: raw-ingest}
    spec: &stream
      type: Python
      mode: cluster
      pythonVersion: "3"
      sparkVersion: "4.0.4"
      image: REQUIRED_SPARK_IMAGE
      imagePullPolicy: IfNotPresent
      suspend: true
      mainApplicationFile: local:///opt/vietpulse/jobs/raw_ingest.py
      arguments:
        - --trigger-interval
        - "10 minutes"
        - --checkpoint-location
        - hdfs://hdfs-namenode.storage.svc.cluster.local:8020/vietpulse/checkpoints/raw-ingest
        - --output-path
        - hdfs://hdfs-namenode.storage.svc.cluster.local:8020/vietpulse/raw
      restartPolicy: {type: OnFailure, onFailureRetries: 3, onFailureRetryInterval: 30, onSubmissionFailureRetries: 3, onSubmissionFailureRetryInterval: 30}
      sparkConf: &sparkConf
        spark.sql.session.timeZone: UTC
        spark.sql.shuffle.partitions: "8"
        spark.driver.extraClassPath: /etc/hadoop/conf
        spark.executor.extraClassPath: /etc/hadoop/conf
        spark.hadoop.dfs.replication: "2"
      volumes:
        - name: client-config
          configMap: {name: spark-client-config}
        - name: mongo
          secret: {secretName: processing-mongodb, defaultMode: 0440}
        - name: elastic
          secret: {secretName: processing-es, defaultMode: 0440}
      driver: &streamDriver
        cores: 1
        coreRequest: 250m
        coreLimit: "1"
        memory: 768m
        memoryOverhead: 256m
        serviceAccount: spark
        nodeSelector: {vietpulse.io/streaming: "true"}
        podSecurityContext: {runAsUser: 185, runAsGroup: 0, fsGroup: 185}
        env: &environment
          - {name: HADOOP_USER_NAME, value: spark}
          - {name: HADOOP_CONF_DIR, value: /etc/hadoop/conf}
          - {name: PYSPARK_PYTHON, value: python3}
          - {name: VP_ES_PASSWORD_FILE, value: /var/run/vietpulse/es/password}
          - {name: VP_ES_CA_FILE, value: /var/run/vietpulse/es/ca.crt}
        volumeMounts: &mounts
          - {name: client-config, mountPath: /etc/hadoop/conf, readOnly: true}
          - {name: mongo, mountPath: /var/run/vietpulse/mongo, readOnly: true}
          - {name: elastic, mountPath: /var/run/vietpulse/es, readOnly: true}
      executor: &streamExecutor
        instances: 1
        cores: 1
        coreRequest: 500m
        coreLimit: "2"
        memory: 1024m
        memoryOverhead: 512m
        podSecurityContext: {runAsUser: 185, runAsGroup: 0, fsGroup: 185}
        env: *environment
        volumeMounts: *mounts
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions: [{key: vietpulse.io/streaming, operator: In, values: ["true"]}]
                - matchExpressions: [{key: vietpulse.io/data, operator: In, values: ["true"]}]
  - apiVersion: sparkoperator.k8s.io/v1beta2
    kind: SparkApplication
    metadata: {name: speed-sentiment}
    spec:
      <<: *stream
      mainApplicationFile: local:///opt/vietpulse/jobs/speed_sentiment.py
      arguments:
        - --bootstrap-servers
        - vietpulse-kafka-bootstrap.messaging.svc:9092
        - --checkpoint-location
        - hdfs://hdfs-namenode.storage.svc.cluster.local:8020/vietpulse/checkpoints/speed-sentiment-a
        - --es-url
        - https://vietpulse-es-es-http.serving.svc:9200
        - --enable-windows
        - --dedup-checkpoint
        - hdfs://hdfs-namenode.storage.svc.cluster.local:8020/vietpulse/checkpoints/speed-sentiment-b-dedup
        - --window-checkpoint
        - hdfs://hdfs-namenode.storage.svc.cluster.local:8020/vietpulse/checkpoints/speed-sentiment-b
        - --dedup-output-path
        - hdfs://hdfs-namenode.storage.svc.cluster.local:8020/vietpulse/checkpoints/speed-sentiment-dedup-output
      driver: {<<: *streamDriver, memory: 1024m, memoryOverhead: 384m}
      executor: {<<: *streamExecutor, memory: 1536m, memoryOverhead: 768m}
  - apiVersion: sparkoperator.k8s.io/v1beta2
    kind: SparkApplication
    metadata: {name: batch-clean}
    spec: &batch
      <<: *stream
      mainApplicationFile: local:///opt/vietpulse/jobs/batch.py
      arguments: [clean, --register-catalog]
      restartPolicy: {type: Never}
      sparkConf:
        <<: *sparkConf
        spark.sql.hive.metastore.version: "4.0.1"
        spark.sql.hive.metastore.jars: path
        spark.sql.hive.metastore.jars.path: file:///opt/hive-client/*
        spark.hadoop.hive.metastore.uris: thrift://hive-metastore.storage.svc:9083
      driver:
        <<: *streamDriver
        nodeSelector: {vietpulse.io/batch: "true"}
        memory: 1024m
        memoryOverhead: 384m
      executor:
        <<: *streamExecutor
        memory: 4096m
        memoryOverhead: 1024m
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions: [{key: vietpulse.io/batch, operator: In, values: ["true"]}]
                - matchExpressions: [{key: vietpulse.io/data, operator: In, values: ["true"]}]
  - apiVersion: sparkoperator.k8s.io/v1beta2
    kind: SparkApplication
    metadata: {name: batch-analytics}
    spec: {<<: *batch, arguments: [analytics, --register-catalog]}
  - apiVersion: sparkoperator.k8s.io/v1beta2
    kind: SparkApplication
    metadata: {name: batch-publish}
    spec: {<<: *batch, arguments: [publish, --register-catalog]}
  - apiVersion: sparkoperator.k8s.io/v1beta2
    kind: SparkApplication
    metadata: {name: reference-refresh}
    spec: {<<: *batch, arguments: [reference-refresh, --register-catalog]}

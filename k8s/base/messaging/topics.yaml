# Required project topics: same partitions and retention as docker/kafka/create-topics.sh.
# Replication is increased for the three-broker deployment; optional YouTube is not enabled.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: raw.news.articles
  labels:
    strimzi.io/cluster: vietpulse
spec:
  partitions: 3
  replicas: 3
  config:
    min.insync.replicas: 2
    retention.ms: 604800000
---

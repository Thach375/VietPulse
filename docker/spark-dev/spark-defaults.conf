# Kafka connector matches Spark 4.0.4 / Scala 2.13. Serving uses Python clients.
# Jar được tải ở lần chạy đầu và giữ trong volume ivy-cache.
spark.master                  local[*]
spark.driver.memory           2g
spark.sql.session.timeZone    UTC
spark.jars.ivy                /opt/ivy
spark.jars.packages           org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.4

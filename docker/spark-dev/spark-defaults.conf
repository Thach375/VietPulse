# Connector phải khớp phiên bản Spark (3.5.3), Elasticsearch (8.15.3) và MongoDB connector 10.x.
# Jar được tải ở lần chạy đầu và giữ trong volume ivy-cache.
spark.master                  local[*]
spark.driver.memory           2g
spark.sql.session.timeZone    UTC
spark.jars.ivy                /opt/ivy
spark.jars.packages           org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,org.mongodb.spark:mongo-spark-connector_2.12:10.4.0,org.elasticsearch:elasticsearch-spark-30_2.12:8.15.3
